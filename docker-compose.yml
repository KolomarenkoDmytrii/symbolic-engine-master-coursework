version: '3.8'

networks:
  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.10.0/24
          gateway: 10.89.10.1
    labels:
      - "app=ardupilot-expert"

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  couchdb_data:
    driver: local

services:
  neo4j:
    image: docker.io/_/neo4j:5.15-community
    container_name: symbolic-neo4j
    restart: always
    networks:
      - backend-net
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/secure_password_graph
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  couchdb:
    image: docker.io/apache/couchdb:latest
    container_name: ardupilot-couchdb
    restart: always
    networks:
      - backend-net
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin_expert
      - COUCHDB_PASSWORD=secure_password_couch
    volumes:
      - couchdb_data:/opt/couchdb/data

  ardupilot-expert-service:
    image: quay.io/ardupilot_expert/core-service:latest
    container_name: ardupilot-expert-service
    restart: always
    networks:
      - backend-net
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://ardupilot-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secure_password_graph
      - COUCHDB_URL=http://admin_expert:secure_password_couch@ardupilot-couchdb:5984
      - RULES_INDEX_DB=ardupilot_rules_index
    volumes:
      - ./output:/app/output
    depends_on:
      neo4j:
        condition: service_healthy
      couchdb:
        condition: service_healthy
